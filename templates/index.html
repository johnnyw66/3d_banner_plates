<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Text Banner Studio & Preview</title>
  
  <!-- Import Three.js & OrbitControls & STLLoader via ES Modules -->
  <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
  </script>

  <style>
    :root {
      --bg: #1e1e24;
      --panel-bg: #282830;
      --accent: #007acc;
      --accent-hover: #005999;
      --text: #f0f0f0;
      --text-muted: #999;
      --border: #3e3e4a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left Control Sidebar */
    #sidebar {
      width: 420px;
      min-width: 380px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 4px 0 16px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="number"],
    select {
      background: #1a1a20;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="file"] {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      border: none;
      padding: 12px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: #3e3e4a;
      color: #fff;
    }
    .btn-secondary:hover { background: #4e4e5d; }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Right 3D Viewport */
    #viewport-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #2e303b 0%, #16171d 100%);
      overflow: hidden;
    }

    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating HUD Panels */
    #hud-info {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(26, 26, 32, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 0.85rem;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hud-label { color: var(--text-muted); }
    .hud-value { font-weight: 600; color: #fff; }

    #hud-toolbar {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      background: rgba(26, 26, 32, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 4px;
    }
    .tool-btn:hover { background: #3e3e4a; }

    #spinner-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      color: #fff;
      z-index: 20;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Left Sidebar Controls -->
  <aside id="sidebar">
    <h1>3D Banner Studio</h1>

    <form id="banner-form">
      <div class="form-group">
        <label for="text">Banner Text</label>
        <input type="text" id="text" name="text" value="WORKSHOP" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="style">Style</label>
          <select id="style" name="style">
            <option value="solid" selected>Solid</option>
            <option value="outline">Outline</option>
          </select>
        </div>
        <div class="form-group">
          <label for="outline_width">Outline (mm)</label>
          <input type="number" id="outline_width" name="outline_width" step="0.1" value="1.2">
        </div>
      </div>

      <div class="form-group">
        <label for="selected_font">Pre-installed Font</label>
        <select id="selected_font" name="selected_font">
          {% for f in fonts %}
            <option value="{{ f }}">{{ f }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="custom_font_file">Or Upload TTF/OTF Font</label>
        <input type="file" id="custom_font_file" name="custom_font_file" accept=".ttf,.otf">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="font_size">Font Size (pt/mm)</label>
          <input type="number" id="font_size" name="font_size" step="1" value="22.0">
        </div>
        <div class="form-group">
          <label for="text_relief">Relief / Height (mm)</label>
          <input type="number" id="text_relief" name="text_relief" step="0.2" value="1.6">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="plate_thickness">Plate Thickness (mm)</label>
          <input type="number" id="plate_thickness" name="plate_thickness" step="0.2" value="2.4">
        </div>
        <div class="form-group">
          <label for="corner_radius">Corner Radius (mm)</label>
          <input type="number" id="corner_radius" name="corner_radius" step="0.5" value="3.0">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="padding_x">Padding X (mm)</label>
          <input type="number" id="padding_x" name="padding_x" step="1" value="8.0">
        </div>
        <div class="form-group">
          <label for="padding_y">Padding Y (mm)</label>
          <input type="number" id="padding_y" name="padding_y" step="1" value="6.0">
        </div>
      </div>

      <div class="btn-group">
        <button type="button" id="btn-preview" class="btn-primary">
          <span>🔄 Update 3D Preview</span>
        </button>
        <button type="button" id="btn-download" class="btn-secondary" disabled>
          <span>💾 Download STL</span>
        </button>
      </div>
    </form>
  </aside>

  <!-- 3D WebGL Viewport -->
  <main id="viewport-container">
    <div id="spinner-overlay">
      <div class="spinner"></div>
      <div id="spinner-text">Compiling CSG geometry...</div>
    </div>

    <div id="hud-info">
      <div><span class="hud-label">Dimensions: </span><span id="dim-val" class="hud-value">-</span></div>
      <div><span class="hud-label">Triangles: </span><span id="tri-val" class="hud-value">-</span></div>
    </div>

    <div id="hud-toolbar">
      <button class="tool-btn" id="btn-recenter">Recenter Camera</button>
      <button class="tool-btn" id="btn-wireframe">Toggle Wireframe</button>
      <input type="color" id="color-picker" value="#00aaff" title="Change Preview Color" style="cursor:pointer; border:none; background:none; height:26px;">
    </div>

    <canvas id="webgl-canvas"></canvas>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    // --- State ---
    let scene, camera, renderer, controls;
    let currentMesh = null;
    let activeStlBlob = null;
    let isWireframe = false;
    let materialColor = 0x00aaff;

    const container = document.getElementById('viewport-container');
    const canvas = document.getElementById('webgl-canvas');
    const spinner = document.getElementById('spinner-overlay');
    const dimVal = document.getElementById('dim-val');
    const triVal = document.getElementById('tri-val');
    const btnDownload = document.getElementById('btn-download');

    // --- Initialize Three.js Scene ---
    function initViewer() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a24);

      // Camera (positioned looking down at a 45 degree angle)
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
      camera.position.set(0, -180, 140);
      camera.up.set(0, 0, 1); // Z-axis is UP for 3D printers

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't flip below buildplate

      // Grid simulating 3D Printer Bed (250 x 250 mm)
      const grid = new THREE.GridHelper(250, 25, 0x555566, 0x333344);
      grid.rotation.x = Math.PI / 2; // Orient grid onto XY plane
      grid.position.z = -0.01;
      scene.add(grid);

      // Lighting setup
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(hemiLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight1.position.set(100, -120, 200);
      dirLight1.castShadow = true;
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x88bbff, 0.8);
      dirLight2.position.set(-100, 120, -50);
      scene.add(dirLight2);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function onWindowResize() {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // --- STL Loading & Mesh Rendering ---
    function loadStlArrayBuffer(buffer) {
      const loader = new STLLoader();
      const geometry = loader.parse(buffer);

      if (currentMesh) {
        scene.remove(currentMesh);
        currentMesh.geometry.dispose();
        currentMesh.material.dispose();
      }

      const material = new THREE.MeshStandardMaterial({
        color: materialColor,
        roughness: 0.35,
        metalness: 0.15,
        wireframe: isWireframe
      });

      currentMesh = new THREE.Mesh(geometry, material);
      currentMesh.castShadow = true;
      currentMesh.receiveShadow = true;

      // Center geometry on build plate
      geometry.computeBoundingBox();
      const bbox = geometry.boundingBox;
      
      const dx = bbox.max.x - bbox.min.x;
      const dy = bbox.max.y - bbox.min.y;
      const dz = bbox.max.z - bbox.min.z;

      // Center X & Y at (0,0), rest Z on bed (Z=0)
      geometry.center();
      currentMesh.position.set(0, 0, dz / 2);

      scene.add(currentMesh);

      // Update HUD
      dimVal.textContent = `${dx.toFixed(1)} × ${dy.toFixed(1)} × ${dz.toFixed(1)} mm`;
      const triCount = geometry.attributes.position.count / 3;
      triVal.textContent = triCount.toLocaleString();

      btnDownload.disabled = false;
    }

    // --- API Communication ---
    async function requestStlGeneration() {
      const form = document.getElementById('banner-form');
      const formData = new FormData(form);

      spinner.style.display = 'flex';
      btnDownload.disabled = true;

      try {
        const response = await fetch('/generate', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Server failed to generate STL.');
        }

        const blob = await response.blob();
        activeStlBlob = blob;
        const arrayBuffer = await blob.arrayBuffer();
        loadStlArrayBuffer(arrayBuffer);
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        spinner.style.display = 'none';
      }
    }

    // --- Event Listeners ---
    document.getElementById('btn-preview').addEventListener('click', requestStlGeneration);

    btnDownload.addEventListener('click', () => {
      if (!activeStlBlob) return;
      const textVal = document.getElementById('text').value.trim() || 'banner';
      const cleanName = textVal.replace(/[^a-zA-Z0-9_-]/g, '_');
      const link = document.createElement('a');
      link.href = URL.createObjectURL(activeStlBlob);
      link.download = `${cleanName}.stl`;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    document.getElementById('btn-recenter').addEventListener('click', () => {
      camera.position.set(0, -180, 140);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    document.getElementById('btn-wireframe').addEventListener('click', () => {
      isWireframe = !isWireframe;
      if (currentMesh) currentMesh.material.wireframe = isWireframe;
    });

    document.getElementById('color-picker').addEventListener('input', (e) => {
      materialColor = parseInt(e.target.value.replace('#', '0x'));
      if (currentMesh) currentMesh.material.color.setHex(materialColor);
    });

    // Start viewer on load & trigger initial preview
    initViewer();
    requestStlGeneration();
  </script>
</body>
</html>
