<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Banner STL Generator</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px auto; max-width: 650px; line-height: 1.5; color: #222; }
    h2 { border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
    .group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .row { display: flex; gap: 15px; }
    .col { flex: 1; }
    button { background: #0066cc; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
    button:hover { background: #0052a3; }
    .hint { font-size: 0.8rem; color: #666; margin-top: 2px; }
  </style>
</head>
<body>
  <h2>3D Banner Generator</h2>
  <form action="/generate" method="post" enctype="multipart/form-data">
    <div class="group">
      <label>Banner Text</label>
      <input type="text" name="text" value="STORAGE BOX" required>
    </div>

    <div class="row group">
      <div class="col">
        <label>Glyph Style</label>
        <select name="style">
          <option value="solid" selected>Solid (Filled)</option>
          <option value="outline">Outline (Hollow)</option>
        </select>
      </div>
      <div class="col">
        <label>Outline Width (mm)</label>
        <input type="number" step="0.1" name="outline_width" value="1.2">
        <div class="hint">Only used for Outline style</div>
      </div>
    </div>

    <div class="row group">
      <div class="col">
        <label>Pre-installed Font</label>
        <select name="selected_font">
          {% for f in fonts %}
            <option value="{{ f }}">{{ f }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col">
        <label>Or Upload Custom TTF/OTF</label>
        <input type="file" name="custom_font_file" accept=".ttf,.otf">
      </div>
    </div>

    <div class="row group">
      <div class="col">
        <label>Font Size (pt/mm)</label>
        <input type="number" step="1.0" name="font_size" value="22.0">
      </div>
      <div class="col">
        <label>Text Relief Height (mm)</label>
        <input type="number" step="0.2" name="text_relief" value="1.6">
      </div>
    </div>

    <div class="row group">
      <div class="col">
        <label>Baseplate Thickness (mm)</label>
        <input type="number" step="0.2" name="plate_thickness" value="2.4">
      </div>
      <div class="col">
        <label>Corner Radius (mm)</label>
        <input type="number" step="0.5" name="corner_radius" value="3.0">
      </div>
    </div>

    <div class="row group">
      <div class="col">
        <label>Padding X (mm)</label>
        <input type="number" step="1.0" name="padding_x" value="8.0">
      </div>
      <div class="col">
        <label>Padding Y (mm)</label>
        <input type="number" step="1.0" name="padding_y" value="6.0">
      </div>
    </div>

    <button type="submit">Generate & Download STL</button>
  </form>
</body>
</html>
